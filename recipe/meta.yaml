{% set name = "Nuitka" %}
{% set version = "4.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: b9c87a694acc424cfffa06abf149fddbdfa85f6daac998df67411b5f4269df0f
  patches:
    - patches/0001-Remove-vendored-zlib-and-zstd-from-setup.py.patch
    # This install_name_tool modifies the binary and outputs a warning about the replaced signature.
    # Nuitka's post-link step catches any stderr output from install_name_tool as a fatal error, even a benign warning.
    # On macOS arm64, binaries are ad-hoc signed. install_name_tool invalidates and re-signs automatically, printing that warning to stderr.
    # Nuitka treats any stderr output from install_name_tool as failure — this is a known osx arm64 bug/limitation.
    - patches/0002-fix-osx-arm64-ignore-benign-install_name_tool-codesi.patch  # [osx and arm64]

build:
  number: 0
  script_env:
    - NUITKA_NO_INLINE_COPY=1
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - nuitka = nuitka.__main__:main
    - nuitka-run = nuitka.__main__:main

requirements:
  host:
    - python
    - pip
    - setuptools >=42
    - wheel
    - scons 4.10.1
    - zlib {{ zlib }}
    - zstd {{ zstd }}
  run:
    - python
    # https://github.com/Nuitka/Nuitka/blob/4.3/nuitka/tools/watch/Conda.py#L51
    - libpython-static  # [not win]
    # https://github.com/Nuitka/Nuitka/blob/4.3/nuitka/containers/OrderedSets.py#L10-L22
    - ordered-set >=4.1.0
    - zstandard >=0.15
    - jinja2
    # Was addInlineCopy()
    - appdirs
    - glob2
    - markupsafe
    - tqdm
    - atomicwrites  # [win]
    - colorama  # [win]
    - pefile  # [win]
    - pyyaml
    - scons 4.10.1
    - zlib
    - zstd

test:
  imports:
    - nuitka
    - nuitka.build
    - nuitka.containers
    - nuitka.finalizations
    - nuitka.freezer
    - nuitka.importing
    - nuitka.nodes
    - nuitka.optimizations
    - nuitka.plugins
    - nuitka.specs
    - nuitka.tools
    - nuitka.tree
    - nuitka.utils
  requires:
    - pip
    - {{ compiler('c') }}
  commands:
    - pip check
    - nuitka --help
    - nuitka-run --help
    - python -m nuitka --version
    - touch Empty.py  # [unix]
    - nuitka --show-scons --run --verbose --disable-ccache Empty.py  # [unix]
    - python -c "open('Empty.py', 'w').close()"  # [win]
    # Disable ccache in the test compilation because of the frozen prompt
    - nuitka --show-scons --run --verbose --disable-ccache --msvc=14.3 --assume-yes-for-downloads Empty.py  # [win]

about:
  home: https://nuitka.net
  license: AGPL-3.0-or-later
  license_family: AGPL
  license_file:
    - LICENSE.txt
    - LICENSE-RUNTIME.txt
  summary: Python compiler with full language support and CPython compatibility
  description: |
    Nuitka is the Python compiler. It is a seamless replacement or extension
    to the Python interpreter and compiles every construct that CPython 2.6,
    2.7, 3.3, 3.4, 3.5, 3.6, and 3.7 have. It then executes uncompiled code,
    and compiled code together in an extremely compatible manner.

    You can use all Python library modules or and all extension modules freely.
    It translates the Python into a C level program that then uses "libpython"
    to execute in the same way as CPython does. All optimization is aimed at
    avoiding overhead, where it's unnecessary. None is aimed at removing
    compatibility, although slight improvements will occassionally be done,
    where not every bug of standard Python is emulated, e.g. more complete
    error messages are given, but there is a full compatibility mode to
    disable even that.
  doc_url: https://nuitka.net/doc/user-manual.html
  dev_url: https://github.com/Nuitka/Nuitka

extra:
  recipe-maintainers:
    - frol
    - kayhayen
